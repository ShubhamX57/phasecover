[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasecover"
version = "0.1.0"
description = "Exposure-corrected searches for periodic modulation in gappy photon event data, built on Astropy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Shubham Shinde" }]
dependencies = [
    "astropy>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "jupyter"]

[project.scripts]
phasecover = "phasecover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["phasecover"]
